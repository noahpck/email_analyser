<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Email Analyser</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Email Analyser</h1>
        <p class="muted">Phishing and scam scores for your Gmail</p>
      </div>
      <div class="sync">
        <span id="sync-status" class="muted">Checking sync…</span>
        <button id="sync-now" class="btn" type="button">Sync now</button>
      </div>
    </header>

    <nav class="tabs" role="tablist">
      <button id="tab-emails" class="tab" role="tab" aria-selected="true" aria-controls="view-emails" type="button">Emails</button>
      <button id="tab-history" class="tab" role="tab" aria-selected="false" aria-controls="view-history" type="button">History &amp; blocked</button>
    </nav>

    <div id="view-emails" role="tabpanel" aria-labelledby="tab-emails">
    <section class="metrics">
      <div class="metric"><span class="label">Analysed</span><span id="m-total" class="value">–</span></div>
      <div class="metric"><span class="label">Flagged</span><span id="m-flagged" class="value danger">–</span></div>
      <div class="metric"><span class="label">Avg score</span><span id="m-avg" class="value">–</span></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Score by date</h2>
        <div id="legend" class="legend"></div>
      </div>
      <div id="chart" class="chart"></div>
    </section>

    <section class="controls">
      <input id="search" type="search" placeholder="Search subject or sender…" aria-label="Search">
      <div id="sources" class="chips" role="group" aria-label="Sources"></div>
      <select id="label-filter" aria-label="Label filter">
        <option value="any">Any label</option>
        <option value="none">Unlabelled</option>
        <option value="safe">Marked safe</option>
        <option value="scam">Marked scam</option>
      </select>
      <label class="toggle">
        <input id="flagged-only" type="checkbox" checked>
        <span class="track"><span class="thumb"></span></span>
        Flagged only
      </label>
    </section>

    <section>
      <h2 id="list-title">Emails</h2>
      <div id="list" class="list"><p class="muted">Loading…</p></div>
    </section>
    </div>

    <div id="view-history" role="tabpanel" aria-labelledby="tab-history" hidden>
      <section class="card">
        <div class="card-head">
          <h2>Blocked senders</h2>
          <span class="muted small">Gmail filters that send mail straight to Trash</span>
        </div>
        <div id="blocked" class="rows"><p class="muted">Loading…</p></div>
      </section>
      <section class="card">
        <div class="card-head">
          <h2>Recent actions</h2>
          <span class="muted small">Trashed emails can be restored for 30 days</span>
        </div>
        <div id="history" class="rows"><p class="muted">Loading…</p></div>
      </section>
    </div>
  </main>

  <div id="tooltip" class="tooltip" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
